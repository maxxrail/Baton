name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Tests must never need a key or the network.
      BATON_LLM: fake
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python + deps
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q

      - name: Retrieval eval (recall@5 gate in evals/thresholds.yaml)
        run: uv run python -m scripts.eval_retrieval

      - name: Simulation suites validate (shape, fixtures, coverage mix)
        run: uv run baton-sim validate

      - name: Simulations, offline (scripted models, gate in evals/thresholds.yaml)
        run: uv run baton-sim run --suite evals/sims/ci --scripted --gate --out evals/reports

      - name: Upload the simulation report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-scripted
          path: evals/reports/
          if-no-files-found: ignore

      - name: Alembic upgrade on a fresh database
        env:
          DATABASE_URL: sqlite:///./ci_fresh.db
        run: uv run alembic upgrade head

  web:
    name: web (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Vitest
        run: npm test

      - name: Typecheck + build
        run: npm run build

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
