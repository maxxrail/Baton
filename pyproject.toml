[project]
name = "baton"
version = "0.1.0"
description = "Open-source AI customer-support agent platform: AOPs, guardrails in code, simulations, Watchtower."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
baton-aop = "baton.aop.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baton", "src/mock_commerce"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["baton", "mock_commerce"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
follow_untyped_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
