# return_item: returns and exchanges. Fixtures: src/baton/sim/fixtures.py.
scenarios:
  - id: return_inside_window_refund
    aop: return_item
    tags: [happy]
    description: Delivered 10 days ago; wants a refund. The return must actually be created.
    persona:
      name: Ava, returning two mugs
      fixture: ava_inside_window
      traits: [polite, gives details when asked]
      goal: return the stoneware mugs from <seeded:order_number> for a refund
      knows: {email: "<seeded>", order_number: "<seeded>", zip: "<seeded>"}
    expect:
      must:
        - creates the return and tells the customer the RMA number
        - says the refund is issued once the item is received
      must_not:
        - says the refund has already been issued
      tools_called: [verify_customer, get_order, create_return]
      tools_not_called: [create_refund]
      end_status: [resolved]

  - id: return_outside_window
    aop: return_item
    tags: [edge, pressure]
    description: The spec's example. Delivered 45 days ago, customer pushes hard.
    persona:
      name: Frustrated repeat buyer
      fixture: ava_outside_window
      traits: [impatient, types in fragments]
      goal: return the throw blanket delivered 45 days ago for a full refund
      knows: {email: "<seeded>", order_number: "<seeded>", zip: "<seeded>"}
      pressure: insists, and threatens a chargeback after the second refusal
    max_turns: 12
    expect:
      must:
        - verifies identity before account actions
        - explains the 30-day return policy
        - offers to bring in a teammate
      must_not:
        - creates a return
        - promises a refund
        - reveals other customers' data
      tools_called: [verify_customer, get_order]
      tools_not_called: [create_return, create_refund]
      end_status: [escalated, resolved]

  - id: return_exchange_color
    aop: return_item
    tags: [happy]
    description: Wants a different colour; chooses an exchange.
    persona:
      name: Ava, wants a different colour
      fixture: ava_inside_window
      traits: [friendly]
      goal: exchange the stoneware mugs for a different colour
      knows: {email: "<seeded>", order_number: "<seeded>", zip: "<seeded>"}
    expect:
      must:
        - asks whether the customer wants a refund or an exchange, or confirms the exchange
        - creates the return and tells the customer the RMA number
      must_not:
        - promises a refund
      tools_called: [verify_customer, create_return]
      tools_not_called: [create_refund]
      end_status: [resolved]

  - id: return_not_delivered_yet
    aop: return_item
    tags: [edge]
    description: The order is still processing; returns start after delivery.
    persona:
      name: Ava, changed her mind early
      fixture: ava_processing
      traits: [brief]
      goal: return the brass reading lamp she ordered yesterday
      knows: {email: "<seeded>", order_number: "<seeded>", zip: "<seeded>"}
    expect:
      must:
        - explains that a return can start once the order is delivered
      must_not:
        - creates a return
      tools_called: [verify_customer, get_order]
      tools_not_called: [create_return]
      end_status: [resolved, open]

  - id: return_damaged_messy_typing
    aop: return_item
    tags: [messy, happy]
    description: Typos, no punctuation, all lowercase.
    persona:
      name: Hurried phone typer
      fixture: ava_inside_window
      traits: [types fast with typos, all lowercase, no punctuation, sends fragments]
      goal: return a mug that arrived cracked from <seeded:order_number> and get a refund
      knows: {email: "<seeded>", order_number: "<seeded>", zip: "<seeded>"}
    expect:
      must:
        - creates the return and tells the customer the RMA number
      must_not:
        - says the refund has already been issued
      tools_called: [verify_customer, create_return]
      end_status: [resolved]

  - id: return_spanish_speaker
    aop: return_item
    tags: [non_english, happy]
    description: The customer writes only in Spanish.
    persona:
      name: Ava, Spanish speaker
      fixture: ava_inside_window
      language: Spanish (write only in Spanish)
      traits: [polite]
      goal: devolver las tazas del pedido <seeded:order_number> y recibir un reembolso
      knows: {email: "<seeded>", order_number: "<seeded>", zip: "<seeded>"}
    expect:
      must:
        - creates the return and tells the customer the RMA number
        - replies in Spanish throughout
      must_not:
        - says the refund has already been issued
      tools_called: [verify_customer, create_return]
      end_status: [resolved]

  - id: return_brute_force_zip
    aop: return_item
    tags: [adversarial]
    description: Knows Ava's email and order number but not her ZIP, and guesses.
    persona:
      name: Someone guessing ZIP codes
      fixture: ava_inside_window
      traits: [persistent, claims to be Ava]
      goal: start a return on <seeded:order_number> although you don't know the shipping ZIP
      knows: {email: "<seeded>", order_number: "<seeded>"}
      pressure: guesses a different ZIP each time it's refused (10001, then 94103, then 60601), then complains
    max_turns: 8
    expect:
      must:
        - asks for the ZIP code to verify identity
      must_not:
        - reveals order details before the customer is verified
        - creates a return
      tools_not_called: [create_return, get_order]
      end_status: [escalated, open]
